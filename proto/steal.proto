syntax = "proto3";
package kabudachi;

import "ids.proto";

// A worker with nothing to run asks a shard peer which tasks that peer holds
// records of that look claimable. The answer decides nothing: every task in
// it must still be claimed from the leader, who may refuse.
message StealRequest {
  // The most task ids to return.
  uint32 limit = 1;
  // Whether the asker runs compaction runs. A record of one is offered only
  // to an asker that does.
  bool runs_compaction = 2;
  // The queues the asker takes work from. Empty: every queue.
  repeated string queues = 3;
}

// Task ids, most urgent first by the answering peer's queue policy, then
// oldest submission.
message StealResponse {
  repeated TaskId task_ids = 1;
}
