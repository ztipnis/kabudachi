syntax = "proto3";
package kabudachi;

import "ids.proto";
import "task.proto";

// The claim-arbitration protocol (`/kabudachi/claim/1`):
// lets a worker ask the leader its node names for permission to run work,
// either one specific pending task (`REQUEST_CLAIM`,
// `core::scheduler::Scheduler::request_claim`) or up to a number of the
// oldest pending ones (`CLAIM_OLDEST`, `Scheduler::claim_oldest`).
//
// Like `JoinRequest`/`JoinResponse` (join.proto), this is a genuine
// request/response exchange used directly as a `request_response::Codec`'s
// `Request`/`Response` types (see `kabudachi_net::claim_codec`).

message ClaimRequest {
  oneof request {
    // REQUEST_CLAIM(T): the one task the worker wants.
    TaskId task_id = 1;
    ClaimOldest oldest = 2;
  }
}

// CLAIM_OLDEST: up to `limit` of the oldest pending tasks the leader can hand
// out now. The leader may answer with fewer, or none.
message ClaimOldest {
  uint32 limit = 1;
}

// Mirrors `core::scheduler::Claim` field-for-field: the leader's grant of
// permission to run a task.
message Claim {
  Task task = 1;
  TaskRunId task_run_id = 2;
  uint32 attempt_number = 3;
  // The serialized inputs of coalescing generations this claim's run
  // absorbed, oldest first (see `core::scheduler::Claim::chain`).
  repeated bytes chain = 4;
}

// The reasons a leader refuses a claim: one enum value for each variant of
// `core::scheduler::ClaimRejection`, and `CLAIM_REJECT_NOT_MEMBER` for a
// claimant that is neither a voter nor a pending member of the shard, which
// must join it first. This is the same enum-plus-reason shape
// `VoteRejectReason` (election.proto) uses for "why was this request
// refused", rather than a separate empty message type for each reason.
enum ClaimRejectReason {
  CLAIM_REJECT_REASON_UNSPECIFIED = 0;
  CLAIM_REJECT_NOT_LEADER = 1;
  CLAIM_REJECT_TASK_UNKNOWN = 2;
  CLAIM_REJECT_NOT_READY = 3;
  CLAIM_REJECT_ALREADY_SELECTED = 4;
  CLAIM_REJECT_FINISHED = 5;
  CLAIM_REJECT_SUPERSEDED = 6;
  CLAIM_REJECT_KEY_BUSY = 7;
  CLAIM_REJECT_NOT_MEMBER = 8;
  CLAIM_REJECT_CANNOT_RUN = 9;
}

message ClaimReject {
  ClaimRejectReason reason = 1;
}

// The answer to `CLAIM_OLDEST`: the claims granted, oldest task first.
message ClaimBatch {
  repeated Claim claims = 1;
}

// `accept` or `reject` answers `REQUEST_CLAIM`; `batch` or `reject` answers
// `CLAIM_OLDEST`. A batch holds only as many claims as fit in one message.
// Today the leader refuses `CLAIM_OLDEST` only as `CLAIM_REJECT_NOT_LEADER`,
// but a claimant must handle any reason.
message ClaimResponse {
  oneof result {
    Claim accept = 1;
    ClaimReject reject = 2;
    ClaimBatch batch = 3;
  }
}
