syntax = "proto3";
package kabudachi;

import "ids.proto";

enum TaskRunState {
  TASK_RUN_STATE_UNSPECIFIED = 0;
  SCHEDULED = 1;
  QUEUED = 2;
  CLAIMED = 3;
  RUNNING = 4;
  SUCCEEDED = 5;
  FAILED = 6;
  EXPIRED = 7;
  SUPERSEDED = 8;
  CANCELLED = 9;
  LOST = 10;
  ORPHANED = 11;
}

// A moment by the wall clock of the worker that stamped it, in milliseconds
// since the Unix epoch. Workers' clocks disagree, so compare two only as far
// as their clocks are known to agree, and never measure a timeout with one.
message WallTime {
  uint64 unix_millis = 1;
}

// The hash function a Digest was computed with. A reader that does not know
// the algorithm cannot check the digest, so it refuses it.
enum DigestAlgorithm {
  DIGEST_ALGORITHM_UNSPECIFIED = 0;
  BLAKE3 = 1;
}

// A content hash: of a task's input, or of a run's result.
message Digest {
  DigestAlgorithm algorithm = 1;
  bytes value = 2;
}

message TaskRunIdentity {
  TaskRunId task_run_id = 1;
  TaskId task_id = 2;
  uint32 attempt_number = 3;
  optional TaskRunId parent_task_run_id = 4;
}

// An immutable submitted invocation. A retry never changes it; it creates a
// new TaskRun instead.
message Task {
  reserved 6, 8, 9;
  TaskId task_id = 1;
  TaskDefinitionId task_definition_id = 2;
  uint32 source_version = 3;
  bytes serialized_input = 4;
  string queue = 5;
  // How many more attempts a failed run may be replaced by. Zero means the
  // task is not retried.
  uint32 max_retries = 7;
  // Set only on a coalescing task: the flat key that decides which pending
  // generations supersede each other. The default key is the empty string.
  optional string coalescing_key = 10;
  // An ephemeral task's run that is lost with its worker is LOST and never
  // replayed.
  bool ephemeral = 11;
  // A non-retriable task's run that was running when its worker was lost is
  // ORPHANED and never replayed, because its effects may have happened.
  bool non_retriable = 12;
  // When the client submitted the task, by the submitting worker's wall
  // clock. Its delay and expiry count from here.
  WallTime submitted_at = 13;
  // How long after submission the task may first start; unset means at once.
  optional uint64 delay_millis = 14;
  // How long after submission the task may wait to start before it expires
  // instead; unset means it never expires.
  optional uint64 expiry_millis = 15;
  // Set only on a compaction run's task: the front of a coalescing key's
  // waiting chain it folds.
  CompactionPrefix compacts = 16;
  // How long after this task's worker falls silent (a suspicion timeout
  // unheard) a run of it may be replayed, and so how long, less drift, its
  // worker has to abort it once cut off. Zero: the shard's default.
  uint64 reconnect_timeout_ms = 17;
}

// The front of a coalescing key's waiting chain a compaction run folds: each
// entry is one chain entry, named by the generations it holds and the digest
// of its payload, so the leader can tell whether the chain still starts with
// exactly these when the result comes back.
message CompactionPrefix {
  string coalescing_key = 1;
  repeated PrefixEntry entries = 2;
}

message PrefixEntry {
  repeated TaskId generations = 1;
  Digest digest = 2;
}

// One execution attempt of a Task. `identity`, the versions and `created_at`
// never change after creation; `state` and `updated_at` are the mutable part.
message TaskRun {
  reserved 4, 6, 8;
  TaskRunIdentity identity = 1;
  uint32 source_version = 2;
  uint32 execution_version = 3;
  TaskRunState state = 5;
  // The worker that claimed this run; the only one whose results the leader
  // accepts. Unset while the run is still pending.
  WorkerId selected_worker = 7;
  // The type name of the error that failed the run (for example
  // "ValueError"), never its message. Empty unless the run is FAILED.
  string failure_kind = 9;
  // When the leader created this run and last changed it, by its wall clock.
  WallTime created_at = 10;
  WallTime updated_at = 11;
  // Digest of the certified result. Unset until the run succeeds.
  Digest result_digest = 12;
}
