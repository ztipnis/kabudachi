syntax = "proto3";
package kabudachi;

import "blob.proto";
import "digest.proto";
import "ids.proto";
import "task.proto";
import "result.proto";
import "step.proto";
import "composite.proto";

// A worker asks its shard's leader to record a task, or tells it what
// became of a run it claimed. Only the leader decides; a worker that is not
// the leader answers TASK_REJECT_NOT_LEADER, and so does a leader that could
// not make its decision last before it lost its lease. As with claims, the
// leader answers only workers its roster holds as voters or pending members,
// and refuses any other with TASK_REJECT_NOT_MEMBER.

// A submission as its client minted it: the task id and submission time
// are fixed before any leader sees it, so resubmitting after a refusal
// names the same task.
message SubmitTask {
  TaskId task_id = 1;
  WallTime submitted_at = 2;
  TaskDefinitionId task_definition_id = 3;
  uint32 source_version = 4;
  bytes serialized_input = 5;
  string queue = 6;
  uint32 max_retries = 7;
  optional uint64 delay_millis = 8;
  optional uint64 expiry_millis = 9;
  optional string coalescing_key = 10;
  bool drop_oldest = 11;
  bool ephemeral = 12;
  bool non_retriable = 13;
  // The task's own reconnect timeout (see `Task.reconnect_timeout_ms`); zero
  // for the shard's.
  uint64 reconnect_timeout_ms = 14;
  // The submitting worker, which awaits the result (see Task.client).
  WorkerId client = 15;
  // Set instead of `serialized_input` when the input is too large for one
  // message (see `Task.input_manifest`). Its blobs are stored before the
  // submission is sent.
  Manifest input_manifest = 16;
  // The task's trace context (see `Task.trace_parent`).
  string trace_parent = 17;
  string trace_state = 18;
  string baggage = 19;
}

message ReportStarted {
  TaskRunId task_run_id = 1;
  // The version the worker migrated the input to. 0 leaves the run's own,
  // which is safe: a worker never runs at 0 a task submitted above 0 (that
  // input is newer than it, so it blocks the task).
  uint32 execution_version = 2;
}

// The worker cannot run this task's input at its version. A run the reporter
// had claimed goes back to the queue; if `incompatible`, the task then ends
// FAILED (MigrationError) and is not retried, else it waits for another worker.
message ReportBlocked {
  TaskId task_id = 1;
  string reason = 2;
  bool incompatible = 3;
}

// The run succeeded. Only the digest of its result travels. The result
// itself goes to the task's client, not to the leader.
message ReportCompleted {
  TaskRunId task_run_id = 1;
  Digest result_digest = 2;
  // The result reached its task's client first.
  bool delivered = 3;
  // Set when the run returned a step: the step to run as its continuation,
  // committed with this certification. `result_digest` is its digest.
  StepDescription continuation = 4;
}

message ReportFailed {
  TaskRunId task_run_id = 1;
  // The error's type name; its message travels in `failure_message`.
  string failure_kind = 2;
  // The error's message, never its traceback; the leader keeps at most 1 KiB.
  string failure_message = 3;
}

// The fold of a compaction run: the payload its worker made by merging the
// entries it was given, oldest first. The one report that carries a payload
// back to the leader.
message ReportCompacted {
  TaskRunId task_run_id = 1;
  bytes folded_payload = 2;
}

// The run ended with no outcome known: the process running its body died.
// The leader decides it as it decides a run lost with its worker.
message ReportLost {
  TaskRunId task_run_id = 1;
}

// Cancels a task, or with `composite_id` a composite; exactly one is set.
message CancelTask {
  TaskId task_id = 1;
  CompositeId composite_id = 2;
}

// Where the leader would place each of these records now, the asker left out:
// a draining worker, which knows no voters, asks before it hands its copies
// over. Decides nothing, so a leader answers it without gating.
message PlaceRecords {
  repeated TaskId task_ids = 1;
  // Composite records and pages, by their record keys (the kad key bytes).
  repeated bytes record_keys = 2;
}

message TaskRequest {
  oneof request {
    SubmitTask submit = 1;
    ReportStarted started = 2;
    ReportCompleted completed = 3;
    ReportFailed failed = 4;
    CancelTask cancel = 5;
    PlaceRecords place = 6;
    ReportCompacted compacted = 7;
    ReportLost lost = 8;
    QueryOutcome query_outcome = 9;
    SubmitComposite submit_composite = 10;
    SubmitMembers submit_members = 11;
    QuerySlowDown query_slow_down = 13;
    ReportBlocked blocked = 12;
  }
}

enum TaskRejectReason {
  TASK_REJECT_REASON_UNSPECIFIED = 0;
  // Ask the leader your node names again later: this worker does not lead,
  // or lost its lease before its decision was stored where it must be.
  TASK_REJECT_NOT_LEADER = 1;
  TASK_REJECT_TOO_LARGE = 2;
  TASK_REJECT_BACKPRESSURE = 3;
  TASK_REJECT_RECORD_TOO_LARGE = 4;
  TASK_REJECT_UNKNOWN_RUN = 5;
  TASK_REJECT_NOT_AUTHORITATIVE = 6;
  // The request could not be read: a missing id, an undecodable digest.
  TASK_REJECT_MALFORMED = 7;
  // A submission under an id the leader holds is answered with that id, so
  // no reason names it.
  reserved 8;
  // The asker is neither a voter nor a pending member of the leader's shard:
  // it must join the shard first. Nothing of the request took effect.
  TASK_REJECT_NOT_MEMBER = 9;
  // The task's newest record is not known to this leader yet, as it is still
  // collecting what its shard holds: ask again. Also the answer to a
  // submission whose coalescing key has a generation not yet known, until
  // that generation is found. Nothing of the request took effect, and the
  // asker keeps what it holds for the run.
  TASK_REJECT_NOT_READY = 10;
  // The task's whole input is larger than the shard takes. Nothing of the
  // request took effect; asking again is refused again.
  TASK_REJECT_PAYLOAD_TOO_LARGE = 12;
  // The composite a request names is over.
  TASK_REJECT_COMPOSITE_FINISHED = 11;
}

message TaskReject {
  TaskRejectReason reason = 1;
}

message SubmitAccepted {
  TaskId task_id = 1;
  // The leader's memory is past its soft limit: a submitter sending more
  // should wait for it to clear (QuerySlowDown).
  bool slow_down = 2;
}

// Whether the leader still asks submitters to wait. Decides nothing.
message QuerySlowDown {}

message SlowDownState {
  bool slow_down = 1;
}

message StartAccepted {}

message RunCertified {
  TaskId task_id = 1;
  TaskRunId task_run_id = 2;
  Digest result_digest = 3;
}

message RunFailed {
  TaskId task_id = 1;
  TaskRunId task_run_id = 2;
  // The attempt queued in its place, if the task had retries left.
  TaskRunId retry = 3;
}

// What a run reported lost became: LOST, or ORPHANED for a running run of a
// non-retriable task, which is never replayed; and the attempt queued in its
// place, if any.
message RunLost {
  TaskId task_id = 1;
  TaskRunId task_run_id = 2;
  TaskRunState state = 3;
  TaskRunId replay = 4;
}

enum CancelOutcome {
  CANCEL_OUTCOME_UNSPECIFIED = 0;
  CANCEL_OUTCOME_CANCELLED = 1;
  CANCEL_OUTCOME_ALREADY_FINISHED = 2;
  CANCEL_OUTCOME_UNKNOWN_TASK = 3;
}

message CancelAnswer {
  CancelOutcome outcome = 1;
  // With CANCEL_OUTCOME_CANCELLED: a worker had claimed the task.
  bool was_running = 2;
}

message BlockNoted {}

message CompactionApplied {
  // Whether the fold replaced the front of its key's chain: false when the
  // chain no longer started with the entries the run was given, and the
  // result was discarded.
  bool applied = 1;
}

message PlacedKey {
  TaskId task_id = 1;
  repeated WorkerId holders = 2;
  // How many of them must store a copy.
  uint32 quorum = 3;
  // Where the record is really placed when the asker is a voter among the
  // nearest to the task: `holders` leaves the asker out, so this names the
  // placement with it in, and the quorum of that. Absent when the asker is not
  // among the holders, where `holders` is the real placement. A writer of
  // blobs stores them there, and keeps its own copy only then.
  PlacedWithAsker with_asker = 4;
  // Set instead of `task_id` for a composite record or page: its record key.
  bytes record_key = 5;
}

message PlacedWithAsker {
  repeated WorkerId holders = 1;
  uint32 quorum = 2;
}

message RecordPlacements {
  repeated PlacedKey placements = 1;
}

message TaskResponse {
  oneof result {
    SubmitAccepted submitted = 1;
    StartAccepted started = 2;
    RunCertified certified = 3;
    RunFailed failed = 4;
    CancelAnswer cancelled = 5;
    TaskReject reject = 6;
    RecordPlacements placements = 7;
    CompactionApplied compaction = 8;
    RunLost lost = 9;
    OutcomeAnswer outcome = 10;
    CompositeAccepted composite = 11;
    MembersAccepted members = 12;
    SlowDownState slow_down = 13;
    BlockNoted blocked = 14;
  }
}
