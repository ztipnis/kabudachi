version: 2.1

# One job runs `bazel test //...`. It is built to spend as few Free-plan
# credits as it can; CONTRIBUTING.md ("Continuous integration") has the
# measurements and the cost model behind each choice.
#
# CircleCI's build tool cache (with_tool_cache) is Bazel's remote cache for
# third-party build outputs and the first-party libraries. Test binaries build
# and the tests run in every job, and Bazel skips every other action whose
# inputs are unchanged. A separate cache holds the unpacked external
# repositories, keyed on the lockfiles.

executors:
  bazel:
    docker:
      # Bazel's official image ships Bazel itself, so the job installs
      # nothing. Its tag is the Bazel version: keep it equal to
      # .bazelversion (the job checks).
      - image: gcr.io/bazel-public/bazel:9.2.0
    # 2 vCPU, 4 GB, 10 credits per minute. .bazelrc's `ci` config matches it.
    resource_class: medium

jobs:
  test:
    executor: bazel
    # Storage is billed at save time as size times retention, so a cache
    # kept one day costs a fifteenth of the default. A cache that expires
    # makes the next run rebuild it once.
    retention:
      caches: 1d
    steps:
      - checkout:
          method: blobless
      - run:
          name: Check the image's Bazel matches .bazelversion
          command: |
            test "$(bazel --version)" = "bazel $(cat .bazelversion)" || {
              echo "The image has $(bazel --version); .bazelversion says $(cat .bazelversion)."
              echo "Update the executor image in .circleci/config.yml."
              exit 1
            }
      - run:
          name: Compute the repository cache key
          command: |
            # The lockfiles and module files decide which repositories Bazel
            # unpacks.
            cat MODULE.bazel MODULE.bazel.lock .bazelversion Cargo.lock runtime/uv.lock \
              > /tmp/repo-cache-key
      - restore_cache:
          keys:
            - bazel-repos-v3-{{ checksum "/tmp/repo-cache-key" }}
            # An older cache still holds most repositories.
            - bazel-repos-v3-
      # CircleCI's build tool cache serves as Bazel's remote cache for the
      # steps inside it. It holds third-party outputs and the first-party
      # libraries; test binaries are tagged no-remote-cache and stay out.
      # It grows by about one copy of the changed libraries per push.
      - with_tool_cache:
          tool: bazel
          steps:
            - run:
                name: Test
                # A hung test fails the job after 5 minutes instead of
                # holding the executor until CircleCI's default limit. The
                # timeout bounds the whole command, whether it keeps printing
                # or goes silent.
                command: timeout --signal=TERM 300 bazel test --config=ci //...
      - save_cache:
          key: bazel-repos-v3-{{ checksum "/tmp/repo-cache-key" }}
          # Unpacking the repositories inside Bazel took about 50 seconds per
          # run on the 2 vCPU quota. The cache is about 590 MiB compressed.
          # The download cache holds the archives and module files Bazel
          # fetched, so a run does not fetch them again.
          paths:
            - /tmp/bazel/repo-contents
            - /tmp/bazel/repo-downloads

workflows:
  test:
    jobs:
      - test
