[package]
name = "kabudachi-contract-extension"
version = "0.1.0"
edition = "2024"

[lib]
name = "_kabudachi_contract"
crate-type = ["cdylib"]

[dependencies]
kabudachi-core = { path = "../../core" }
kabudachi-py-result-backend = { path = "../py_backend" }
kabudachi-testkit = { path = "../../testkit" }
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
