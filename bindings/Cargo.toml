[package]
name = "kabudachi-bindings"
version = "0.1.0"
edition = "2024"

[lib]
name = "kabudachi_bindings"
crate-type = ["cdylib", "rlib"]

[dependencies]
kabudachi-core = { path = "../core" }
kabudachi-net = { path = "../net" }
kabudachi-redis-authority = { path = "../redis_authority" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
log = "0.4.34"
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
pyo3-log = "0.13.4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1.44", features = ["log"] }
